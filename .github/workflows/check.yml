name: Build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Offline checks
        run: ./scripts/test.sh
      - name: Release build
        run: ./scripts/package.sh
      - name: Verify app signature
        run: codesign --verify --strict dist/GPUBar.app
